services:

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: pramodsadekar1718/agrikart:${BACKEND_TAG}
    restart: unless-stopped
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_NAME: agrikart_pool
      DB_POOL_SIZE: 5
    volumes:
      - product_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: pramodsadekar1718/agrikart:frontend
    restart: unless-stopped
    volumes:
      - product_uploads:/usr/share/nginx/html/uploads:ro
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  product_uploads: