<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Results - AgriKart</title>
<link rel="icon" href="assets/images/placeholder.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/components.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container section-py">
  <form id="searchPageForm" class="mb-3 d-flex gap-2">
    <input type="search" id="searchPageInput" class="form-control" placeholder="Search products...">
    <button class="btn btn-brand"><i class="bi bi-search"></i> Search</button>
  </form>

  <h4 id="searchHeading" class="section-title"></h4>
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <span class="muted"><span id="resultCount">0</span> results</span>
    <select class="form-select" id="sortSelect" style="width:auto">
      <option value="relevance">Sort: Relevance</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="rating-desc">Highest Rated</option>
      <option value="newest">Newest</option>
    </select>
  </div>

  <div class="row g-4">
    <div class="col-lg-3" id="filterSidebar"></div>
    <div class="col-lg-9">
      <div class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-3" id="productGrid"></div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/products.js"></script>
<script>document.addEventListener("DOMContentLoaded", initSearchPage);</script>
</body>
</html>
