name: Agrikart CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # 1. TEST + SECURITY
  # =========================
  test-security:
    name: Test and Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest bandit pip-audit

      - name: Run tests
        run: |
          pytest -v

      - name: Bandit security scan
        run: |
          bandit -r . -ll

      - name: Dependency vulnerability scan
        run: |
          pip-audit


  # =========================
  # 2. BUILD BACKEND IMAGE
  # =========================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build --pull --no-cache \
            -t agrikart-backend \
            -f backend/Dockerfile \
            .


  # =========================
  # 3. DOCKER IMAGE SECURITY
  # =========================
  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build --pull --no-cache \
            -t agrikart-backend \
            -f backend/Dockerfile \
            .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agrikart-backend
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  # =========================
  # 4. PUSH TO DOCKER HUB
  # =========================
  docker-push:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build --pull --no-cache \
            -t pramodsadekar1718/agrikart:backend \
            -f backend/Dockerfile \
            .

      - name: Push backend image
        run: |
          docker push pramodsadekar1718/agrikart:backend