name: Agrikart CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # 1. TEST + SECURITY
  # =========================
  test-security:
    name: Test and Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest bandit pip-audit

      - name: Run tests
        run: |
          pytest -v

      - name: Bandit security scan
        run: |
          bandit -r . -ll

      - name: Dependency vulnerability scan
        run: |
          pip-audit


  # =========================
  # 2. BUILD BACKEND IMAGE
  # =========================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build --pull --no-cache \
            -t agrikart-backend \
            -f backend/Dockerfile \
            .

    # =========================
  # 3. PUSH TO DOCKER HUB
  # =========================
  docker-push:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image-tag
        run: |
          echo "TAG=backend-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build --pull --no-cache \
            -t pramodsadekar1718/agrikart:${{ steps.image-tag.outputs.TAG }} \
            -f backend/Dockerfile \
            .

      - name: Push versioned backend image
        run: |
          docker push pramodsadekar1718/agrikart:${{ steps.image-tag.outputs.TAG }}

      - name: Also update latest backend tag
        run: |
          docker tag \
            pramodsadekar1718/agrikart:${{ steps.image-tag.outputs.TAG }} \
            pramodsadekar1718/agrikart:backend

          docker push pramodsadekar1718/agrikart:backend


# =========================
  # 4. DEBUG AWS OIDC
  # =========================
  aws-auth-test:
  name: Test AWS OIDC Authentication
  runs-on: ubuntu-latest

  permissions:
    id-token: write
    contents: read

  environment:
    name: production

  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::958075960786:role/AgrikartProductionSSM
        aws-region: ap-south-1

    - name: Verify AWS identity
      run: |
        aws sts get-caller-identity