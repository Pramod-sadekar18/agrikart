name: Agrikart CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # 1. TEST + SECURITY
  # =========================
  test-security:
    name: Test and Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest bandit pip-audit

      - name: Run tests
        run: |
          pytest -v

      - name: Bandit security scan
        run: |
          bandit -r . -ll

      - name: Dependency vulnerability scan
        run: |
          pip-audit


  # =========================
  # 2. BUILD BACKEND IMAGE
  # =========================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build --pull --no-cache \
            -t agrikart-backend \
            -f backend/Dockerfile \
            .

    # =========================
  # 3. PUSH TO DOCKER HUB
  # =========================
  docker-push:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image-tag
        run: |
          echo "TAG=backend-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build --pull --no-cache \
            -t pramodsadekar1718/agrikart:${{ steps.image-tag.outputs.TAG }} \
            -f backend/Dockerfile \
            .

      - name: Push versioned backend image
        run: |
          docker push pramodsadekar1718/agrikart:${{ steps.image-tag.outputs.TAG }}

      - name: Also update latest backend tag
        run: |
          docker tag \
            pramodsadekar1718/agrikart:${{ steps.image-tag.outputs.TAG }} \
            pramodsadekar1718/agrikart:backend

          docker push pramodsadekar1718/agrikart:backend


  # =========================
  # 4. DEBUG AWS OIDC
  # =========================
  # =========================
  # 4. DEPLOY TO STAGING
  # =========================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs:
      - docker-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::958075960786:role/AgrikartProductionSSM
          aws-region: ap-south-1

      - name: Deploy backend to staging
        id: deploy
        shell: bash
        run: |
          TAG="backend-${GITHUB_SHA::7}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-07fff77980e335d28" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy AgriKart backend to staging" \
            --parameters 'commands=[
              "set -e",
              "IMAGE=pramodsadekar1718/agrikart:'"$TAG"'",
              "ENV_FILE=/tmp/agrikart-backend.env",
              "docker pull $IMAGE",
              "docker inspect agrikart-backend-1 --format '\''{{range .Config.Env}}{{println .}}{{end}}'\'' > $ENV_FILE",
              "docker stop agrikart-backend-1 || true",
              "docker rm agrikart-backend-1 || true",
              "docker run -d --name agrikart-backend-1 --restart unless-stopped --network agrikart_default --network-alias backend --env-file $ENV_FILE -v agrikart_product_uploads:/app/uploads $IMAGE",
              "rm -f $ENV_FILE",
              "sleep 5",
              "curl -f http://localhost:8081",
              "echo STAGING DEPLOYMENT SUCCESSFUL",
              "docker inspect agrikart-backend-1 --format '\''{{.Config.Image}}'\''"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for staging deployment..."

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-07fff77980e335d28" \
              --query "Status" \
              --output text)

            echo "Attempt $i: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Staging deployment successful."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Staging deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-07fff77980e335d28" \
                --query "StandardErrorContent" \
                --output text

              exit 1
            fi

            sleep 5
          done

          echo "Staging deployment timed out."
          exit 1