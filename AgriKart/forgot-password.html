<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - AgriKart</title>
<link rel="icon" href="assets/images/placeholder.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/components.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container section-py">
  <div class="auth-card">
    <div class="text-center mb-3">
      <i class="bi bi-shield-lock fs-1 text-green"></i>
      <h3 class="fw-bold mt-2">Reset Password</h3>
    </div>
    <div class="step-indicator">
      <span class="active" data-step="1">1</span>
      <span data-step="2">2</span>
      <span data-step="3">3</span>
    </div>

    <div class="fp-step" data-step="1">
      <p class="muted small text-center">Enter your registered email or mobile number to receive an OTP.</p>
      <form id="fpStep1Form">
        <div class="mb-3">
          <input type="text" class="form-control" id="fpIdentifier" placeholder="Email or Mobile Number" required>
        </div>
        <button class="btn btn-brand w-100">Send OTP</button>
      </form>
    </div>

    <div class="fp-step d-none" data-step="2">
      <p class="muted small text-center">Enter the 6-digit OTP sent to you (demo OTP: 123456).</p>
      <form id="fpStep2Form">
        <div class="mb-3">
          <input type="text" maxlength="6" class="form-control text-center" id="fpOtp" placeholder="Enter OTP" required>
        </div>
        <button class="btn btn-brand w-100">Verify OTP</button>
      </form>
    </div>

    <div class="fp-step d-none" data-step="3">
      <p class="muted small text-center">Create your new password.</p>
      <form id="fpStep3Form">
        <div class="mb-3">
          <input type="password" class="form-control" id="fpNewPassword" placeholder="New Password" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" id="fpConfirmPassword" placeholder="Confirm New Password" required>
        </div>
        <button class="btn btn-brand w-100">Reset Password</button>
      </form>
    </div>

    <p class="text-center small mt-3 mb-0"><a href="login.html">Back to Login</a></p>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>document.addEventListener("DOMContentLoaded", initForgotPasswordPage);</script>
</body>
</html>
