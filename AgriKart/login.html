<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AgriKart</title>
<link rel="icon" href="assets/images/placeholder.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/components.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container section-py">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-flower2 fs-1 text-green"></i>
      <h3 class="fw-bold mt-2">Welcome Back</h3>
      <p class="muted small">Login to continue to AgriKart</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Email / Mobile Number</label>
        <input type="text" class="form-control" name="identifier" required>
      </div>
      <div class="mb-2">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" name="password" id="loginPassword" required>
          <button type="button" class="btn btn-outline-secondary toggle-password" data-target="loginPassword"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label small" for="rememberMe">Remember Me</label>
        </div>
        <a href="forgot-password.html" class="small">Forgot Password?</a>
      </div>
      <button class="btn btn-brand w-100" type="submit">Login</button>
      <p class="text-center small mt-3 mb-0">New to AgriKart? <a href="register.html">Create Account</a></p>
    </form>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>document.addEventListener("DOMContentLoaded", initLoginPage);</script>
</body>
</html>
