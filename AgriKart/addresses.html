<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Addresses - AgriKart</title>
<link rel="icon" href="assets/images/placeholder.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/components.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container section-py">
  <div class="row g-4">
    <div class="col-lg-3"><div class="account-sidebar" id="accountSidebar"></div></div>
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="section-title mb-0">My Addresses</h3>
        <button class="btn btn-brand" id="addAddressBtn"><i class="bi bi-plus-lg"></i> Add New Address</button>
      </div>
      <div id="addressList"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Address Modal -->
<div class="modal fade" id="addressModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addressModalTitle">Add New Address</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="addressForm">
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Type</label>
            <select class="form-select" name="type">
              <option>Home</option><option>Work</option><option>Other</option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label">Full Name</label><input class="form-control" name="name" required></div>
          <div class="mb-2"><label class="form-label">Mobile</label><input class="form-control" name="mobile" required></div>
          <div class="mb-2"><label class="form-label">Address</label><input class="form-control" name="address" required></div>
          <div class="row g-2">
            <div class="col-md-4"><label class="form-label">City</label><input class="form-control" name="city" required></div>
            <div class="col-md-4"><label class="form-label">State</label><input class="form-control" name="state" required></div>
            <div class="col-md-4"><label class="form-label">PIN Code</label><input class="form-control" name="pincode" required></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save Address</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/account.js"></script>
<script>document.addEventListener("DOMContentLoaded", initAddressesPage);</script>
</body>
</html>
