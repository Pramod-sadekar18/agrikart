<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - AgriKart</title>
<link rel="icon" href="assets/images/placeholder.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/components.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container section-py">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-flower2 fs-1 text-green"></i>
      <h3 class="fw-bold mt-2">Create Account</h3>
      <p class="muted small">Join AgriKart today</p>
    </div>
    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" name="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mobile Number</label>
        <input type="tel" class="form-control" name="mobile" placeholder="10-digit mobile number" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" name="password" id="regPassword" required>
          <button type="button" class="btn btn-outline-secondary toggle-password" data-target="regPassword"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" name="confirmPassword" required>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="terms" id="termsCheck">
        <label class="form-check-label small" for="termsCheck">I agree to the <a href="#">Terms &amp; Conditions</a></label>
      </div>
      <button class="btn btn-brand w-100" type="submit">Create Account</button>
      <p class="text-center small mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>document.addEventListener("DOMContentLoaded", initRegisterPage);</script>
</body>
</html>
