<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category - AgriKart</title>
<link rel="icon" href="assets/images/placeholder.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/components.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container section-py">
  <nav aria-label="breadcrumb"><ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
    <li class="breadcrumb-item active">Category</li>
  </ol></nav>

  <div id="categoryBanner" class="mb-4"></div>

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <span class="muted"><span id="resultCount">0</span> products found</span>
    <div class="d-flex align-items-center gap-2">
      <div class="btn-group">
        <button class="btn btn-outline-brand view-toggle active" data-view="grid"><i class="bi bi-grid-3x3-gap"></i></button>
        <button class="btn btn-outline-brand view-toggle" data-view="list"><i class="bi bi-list-ul"></i></button>
      </div>
      <select class="form-select" id="sortSelect" style="width:auto">
        <option value="relevance">Sort: Relevance</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating-desc">Highest Rated</option>
        <option value="newest">Newest</option>
      </select>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-3" id="filterSidebar"></div>
    <div class="col-lg-9">
      <div class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-3" id="productGrid"></div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/products.js"></script>
<script>document.addEventListener("DOMContentLoaded", initCategoryPage);</script>
</body>
</html>
