<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password - AgriKart</title>
<link rel="icon" href="assets/images/placeholder.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/components.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container section-py">
  <div class="row g-4">
    <div class="col-lg-3"><div class="account-sidebar" id="accountSidebar"></div></div>
    <div class="col-lg-9">
      <h3 class="section-title">Change Password</h3>
      <div class="filter-box" style="max-width:480px">
        <form id="changePasswordForm">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-control" name="currentPassword" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" name="newPassword" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" name="confirmPassword" required>
          </div>
          <button class="btn btn-brand" type="submit">Update Password</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/account.js"></script>
<script src="js/auth.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => { renderAccountSidebar("change-password.html"); initChangePasswordPage(); });</script>
</body>
</html>
