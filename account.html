<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - AgriKart</title>
<link rel="icon" href="assets/images/placeholder.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/components.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container section-py">
  <div class="row g-4">
    <div class="col-lg-3"><div class="account-sidebar" id="accountSidebar"></div></div>
    <div class="col-lg-9" id="dashboardMount">
      <h3 id="dashGreeting" class="section-title">Hello!</h3>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat-card"><div class="num" id="statTotalOrders">0</div><div class="small muted">Total Orders</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="num" id="statPendingOrders">0</div><div class="small muted">Pending Orders</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="num" id="statDeliveredOrders">0</div><div class="small muted">Delivered Orders</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="num" id="statWishlistItems">0</div><div class="small muted">Wishlist Items</div></div></div>
      </div>

      <h5 class="section-title">Recent Orders</h5>
      <div id="recentOrdersList" class="mb-4"></div>

      <h5 class="section-title">Recently Viewed Products</h5>
      <div id="dashRecentlyViewed"></div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script> <!-- ADDED: required for getCurrentUser() -->
<script src="js/products.js"></script>
<script src="js/orders.js"></script>
<script src="js/account.js"></script>
<script>document.addEventListener("DOMContentLoaded", initAccountDashboard);</script>
</body>
</html>
